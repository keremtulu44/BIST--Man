[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bistman"
version = "0.1.0"
description = "BIST 50 + emtia bildirim/skorlama hattı (kişisel kullanım)"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]  # KAP ve Telegram istemcileri

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/bistman"]
